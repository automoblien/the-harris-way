<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Careers & Driver Application | The Harris Way</title>
  
  <link rel="icon" type="image/png" href="favicon.png">

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Open Sans', sans-serif; color: #2c3e50; background-color: #f4f6f9; line-height: 1.6; }
    h1, h2, h3, .logo { font-family: 'Montserrat', sans-serif; }
    a { text-decoration: none; color: inherit; }

    header { background-color: #1b263b; position: sticky; top: 0; z-index: 1000; }
    nav { max-width: 1250px; margin: 0 auto; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.6rem; font-weight: 800; color: #ffffff; }
    .logo span { color: #e65c00; }
    .nav-menu { display: flex; list-style: none; gap: 2rem; }
    .nav-menu a { color: #ffffff; font-weight: 600; text-transform: uppercase; }
    .nav-menu a:hover, .nav-menu a.active { color: #e65c00; }

    .banner { background: #e65c00; color: #fff; padding: 4rem 1.5rem; text-align: center; }
    .banner h1 { font-size: 2.5rem; text-transform: uppercase; }

    .form-container { max-width: 700px; margin: 3rem auto; background: #fff; padding: 2.5rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 0.4rem; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.8rem; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.95rem; }
    .btn-apply { width: 100%; background-color: #0d1b2a; color: #fff; padding: 1rem; border: none; border-radius: 4px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
    .btn-apply:hover { background-color: #e65c00; }

    footer { background-color: #0a1118; color: #94a3b8; text-align: center; padding: 2rem; margin-top: 3rem; }

    /* Mobile Responsive Styles */
    @media (max-width: 768px) {
      nav { flex-direction: column; gap: 1rem; padding: 1rem; text-align: center; }
      .nav-menu { gap: 1rem; justify-content: center; flex-wrap: wrap; }
      .banner { padding: 2.5rem 1rem; }
      .banner h1 { font-size: 1.8rem; }
      .form-container { margin: 1.5rem 1rem; padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="index.html" class="logo"><i class="fa-solid fa-truck-moving"></i> THE HARRIS <span>WAY</span></a>
      <ul class="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="company.html">Company</a></li>
        <li><a href="careers.html" class="active">Careers</a></li>
      </ul>
    </nav>
  </header>

  <div class="banner">
    <h1>Drive For The Harris Way</h1>
    <p>Top-tier CPM rates, weekly home time, and modern fleet equipment.</p>
  </div>

  <div class="form-container">
    <h2 style="margin-bottom: 1.5rem; color: #0d1b2a;">Driver Application Form</h2>
    <form>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" placeholder="(555) 000-0000" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" placeholder="john@example.com" required>
      </div>
      <div class="form-group">
        <label>Do you hold a valid Commercial Driver's License (CDL)?</label>
        <select>
          <option>Yes - Class A CDL</option>
          <option>Yes - Class B CDL</option>
          <option>No</option>
        </select>
      </div>
      <div class="form-group">
        <label>Years of Driving Experience</label>
        <input type="number" min="0" placeholder="e.g. 3" required>
      </div>
      <button type="submit" class="btn-apply">Submit Application</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2026 The Harris Way Transportation & Logistics. All rights reserved.</p>
  </footer>

</body>
</html>
